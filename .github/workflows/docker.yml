# GitHub Actions — сборка и публикация Docker-образов в GHCR
name: docker-images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
      - "version"
  workflow_dispatch:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  RELAY_IMAGE: ghcr.io/rasmusvraa/tgwebproxyr-relay
  MTPROXY_IMAGE: ghcr.io/rasmusvraa/tgwebproxyr-mtproxy

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version / tags
        id: meta
        run: |
          set -euo pipefail
          VER="$(tr -d '[:space:]' < version)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push relay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.relay
          push: true
          tags: |
            ${{ env.RELAY_IMAGE }}:latest
            ${{ env.RELAY_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay

      - name: Build & push mtproxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mtproxy
          push: true
          tags: |
            ${{ env.MTPROXY_IMAGE }}:latest
            ${{ env.MTPROXY_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=mtproxy
          cache-to: type=gha,mode=max,scope=mtproxy
