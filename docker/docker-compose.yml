# TgWebProxyR — Docker Compose
# По умолчанию: готовые образы GHCR (быстро). Сборка: TWPR_DOCKER_BUILD=1

services:
  caddy:
    image: ${TWPR_CADDY_IMAGE:-caddy:2.8-alpine}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      ACME_EMAIL: ${TWPR_EMAIL}
      TPROXY_HOSTNAME: ${TWPR_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
    networks:
      - twpr

  relay:
    image: ${TWPR_RELAY_IMAGE:-ghcr.io/rasmusvraa/tgwebproxyr-relay}:${TWPR_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: docker/Dockerfile.relay
      args:
        TWPR_VERSION: ${TWPR_IMAGE_TAG:-1.4.2}
        TPROXY_REF: ${TPROXY_REF:-master}
    restart: unless-stopped
    environment:
      TWPR_HOSTNAME: ${TWPR_HOSTNAME}
      TWPR_SECRET: ${TWPR_SECRET}
      TWPR_BACKEND: mtproxy:2398
      TWPR_SITE_DIR: /srv/tproxy-site
      TWPR_CFG_DIR: /etc/tproxy-server
    volumes:
      - ../site:/srv/tproxy-site:ro
      - relay_cfg:/etc/tproxy-server
    expose:
      - "8080"
      - "8081"
    depends_on:
      - mtproxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - twpr

  mtproxy:
    image: ${TWPR_MTPROXY_IMAGE:-ghcr.io/rasmusvraa/tgwebproxyr-mtproxy}:${TWPR_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: docker/Dockerfile.mtproxy
      args:
        TWPR_VERSION: ${TWPR_IMAGE_TAG:-1.4.2}
    restart: unless-stopped
    environment:
      MTPROXY_SECRET: ${TWPR_SECRET}
      MTPROXY_WORKERS: ${MTPROXY_WORKERS:-1}
      MTPROXY_MAX_CONNECTIONS: ${MTPROXY_MAX_CONNECTIONS:-4096}
    volumes:
      - mtproxy_data:/etc/mtproxy
    expose:
      - "2398"
      - "8888"
    networks:
      - twpr

  bot:
    profiles: ["bot"]
    image: python:3.12-alpine
    pull_policy: missing
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "twpr_bot.py"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      TWPR_DOCKER: "1"
      TWPR_HOSTNAME: ${TWPR_HOSTNAME}
      TWPR_SECRET: ${TWPR_SECRET}
    volumes:
      - ../bot:/app:ro
    depends_on:
      - relay
    networks:
      - twpr

networks:
  twpr:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  relay_cfg:
  mtproxy_data:
