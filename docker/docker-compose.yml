# TgWebProxyR — Docker Compose
#
# tproxy-server требует numeric loopback для listen И backend.
# Поэтому mtproxy + relay + caddy делят один network namespace (localhost общий).

services:
  # «якорный» контейнер: публичные порты + общий localhost для остальных
  mtproxy:
    image: ${TWPR_MTPROXY_IMAGE:-ghcr.io/rasmusvraa/tgwebproxyr-mtproxy}:${TWPR_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: docker/Dockerfile.mtproxy
      args:
        TWPR_VERSION: ${TWPR_IMAGE_TAG:-1.5.0}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # admin relay через socat (см. admin-proxy): host loopback → 18081 → 127.0.0.1:8081
      - "127.0.0.1:8081:18081"
    environment:
      MTPROXY_SECRET: ${TWPR_SECRET}
      MTPROXY_WORKERS: ${MTPROXY_WORKERS:-1}
      MTPROXY_MAX_CONNECTIONS: ${MTPROXY_MAX_CONNECTIONS:-4096}
      # --nat-info: auto в entrypoint; override LOCAL:PUBLIC или off
      MTPROXY_NAT_INFO: ${MTPROXY_NAT_INFO:-}
      MTPROXY_EXTERNAL_IP: ${MTPROXY_EXTERNAL_IP:-}
      MTPROXY_INTERNAL_IP: ${MTPROXY_INTERNAL_IP:-}
      TWPR_HOST_PROFILES: /run/twpr/profiles.json
    volumes:
      - mtproxy_data:/etc/mtproxy
      # все client secrets → несколько -S (shared backend)
      - /etc/tgwebproxyr/profiles.json:/run/twpr/profiles.json:ro
      - ./entrypoint-mtproxy.sh:/usr/local/bin/entrypoint-mtproxy.sh:ro
    networks:
      - twpr

  # tproxy admin только на 127.0.0.1 внутри netns — проброс на eth0 для publish
  admin-proxy:
    image: alpine/socat:1.8.0.1
    pull_policy: missing
    restart: unless-stopped
    network_mode: "service:mtproxy"
    command: ["TCP-LISTEN:18081,fork,reuseaddr,bind=0.0.0.0", "TCP:127.0.0.1:8081"]
    depends_on:
      - mtproxy

  relay:
    image: ${TWPR_RELAY_IMAGE:-ghcr.io/rasmusvraa/tgwebproxyr-relay}:${TWPR_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: docker/Dockerfile.relay
      args:
        TWPR_VERSION: ${TWPR_IMAGE_TAG:-1.5.0}
    restart: unless-stopped
    network_mode: "service:mtproxy"
    environment:
      TWPR_HOSTNAME: ${TWPR_HOSTNAME}
      TWPR_SECRET: ${TWPR_SECRET}
      TWPR_BACKEND: 127.0.0.1:2398
      TWPR_SITE_DIR: /srv/tproxy-site
      TWPR_CFG_DIR: /etc/tproxy-server
      TWPR_HOST_PROFILES: /run/twpr/profiles.json
      TWPR_ADMIN_LISTEN: 127.0.0.1:8081
      TWPR_LISTEN: 127.0.0.1:8080
    volumes:
      - ../site:/srv/tproxy-site:ro
      - relay_cfg:/etc/tproxy-server
      - /etc/tgwebproxyr/profiles.json:/run/twpr/profiles.json:ro
      - ./entrypoint-relay.sh:/usr/local/bin/entrypoint-relay.sh:ro
    depends_on:
      - mtproxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 25s

  caddy:
    image: ${TWPR_CADDY_IMAGE:-caddy:2.8-alpine}
    pull_policy: missing
    restart: unless-stopped
    network_mode: "service:mtproxy"
    environment:
      ACME_EMAIL: ${TWPR_EMAIL}
      TPROXY_HOSTNAME: ${TWPR_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy

networks:
  twpr:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  relay_cfg:
  mtproxy_data:
